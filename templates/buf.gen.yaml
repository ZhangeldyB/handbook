# buf code generation. Copy to the repository root and replace <module>.
# Last verified: 2026-10-28 with buf 1.75.0, protoc-gen-go v1.36.12, protoc-gen-go-grpc v1.6.2.
#
# The plugins run through `go tool`, so their versions are pinned in go.mod and
# stay aligned with the protobuf and gRPC runtime the service links:
#   go get -tool google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
#   go get -tool google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
#
# Managed mode sets go_package from the file path, so .proto files do not
# declare go_package themselves.
version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: <module>/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto
